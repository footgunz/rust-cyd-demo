[package]
edition      = "2024"
name         = "cyd-rust"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "cyd-rust"
path = "./src/bin/main.rs"


[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32"] }
esp-backtrace = { version = "0.19.0", features = ["esp32", "panic-handler", "println"] }


esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }

critical-section = "1.2.0"
nb                = "1.1.0"

# Wi-Fi. esp-radio needs a heap and a scheduler; esp-rtos supplies the latter.
esp-alloc       = "0.10.0"
esp-rtos        = { version = "0.3.0", features = ["esp-alloc", "esp-radio", "esp32"] }
esp-radio       = { version = "0.18.0", features = ["esp-alloc", "esp32", "unstable", "wifi", "ble", "coex"] }
embassy-futures = "0.1.2"

# Display stack for the CYD's 2.8" ILI9341 panel
embedded-graphics = "0.8.2"
embedded-hal      = "1.0.0"
embedded-hal-bus  = "0.3.0"
mipidsi           = "0.10.0"
heapless          = "0.9.3"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
